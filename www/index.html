<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Hello Aisha</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #4C1D95;
        color: #F5F3FF;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
        text-align: center;
        padding: 2rem;
      }
      .card { max-width: 320px; }
      h1 { font-size: 1.4rem; margin: 0 0 .5rem; font-weight: 700; }
      p { font-size: .95rem; line-height: 1.5; opacity: .9; margin: .25rem 0; }
      .spinner {
        margin: 1.5rem auto 0;
        width: 28px; height: 28px;
        border: 3px solid rgba(255,255,255,.25);
        border-top-color: #F5F3FF;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Hello Aisha</h1>
      <p>Someone is here to listen.</p>
      <p>Connecting&hellip;</p>
      <div class="spinner" aria-hidden="true"></div>
    </div>
    <script>
      // Offline fallback. The native WebView normally loads the live site at
      // https://helloaisha.online automatically. This page only shows if that
      // remote load fails (e.g. no internet on first launch). We retry shortly.
      window.addEventListener("load", function () {
        setTimeout(function () {
          if (location.href.indexOf("helloaisha.online") === -1) {
            window.location.replace("https://helloaisha.online");
          }
        }, 1500);
      });
    </script>
  </body>
</html>
